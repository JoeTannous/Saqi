name: Sync satellite

on:
  schedule:
    - cron: "41 5 * * *"   # daily; Sentinel-2 passes every ~5 days
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m api.sync_satellite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SH_CLIENT_ID: ${{ secrets.SH_CLIENT_ID }}
          SH_CLIENT_SECRET: ${{ secrets.SH_CLIENT_SECRET }}
