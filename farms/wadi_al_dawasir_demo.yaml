# DEMO FARM. Two real centre-pivot circles in Wadi Al-Dawasir, Saudi Arabia, traced
# on geojson.io satellite imagery. They are not Agrimatco or pilot fields and the
# farm details below are assumptions, chosen to show Saqi on real Saudi crops.
# Replace with the pilot farm when the farm manager sends its plots.
#
# Assumptions (all to confirm):
# - Crop: alfalfa, the usual pivot crop here (FAO-56 averaged-cutting Kc).
# - Soil: loamy sand (sandy desert soils).
# - Pivot rate 0.45 mm/h averaged over the circle (~10.8 mm/day running 24 h),
#   a typical system capacity; real value = pivot flow / circle area.
# - Efficiency 0.85 (pivot default in engine/data/systems.yaml).
# - At most 24 h of running per day; larger refills carry over to the next days.

name: Wadi Al-Dawasir pivots (demo)
owner_whatsapp: "+966500000000"
